[package]
name = "xiaoai_llm"
version = "0.1.0"
description = "Utils to power XiaoAi with LLM; 使用大型语言模型为小爱同学提供更多功能"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
brain = { path = "../rBrain", version = "0.1" }
netease = { path = "../rNetease", version = "0.1" }
dotenvy.workspace = true
mime_guess = "2"
rand.workspace = true
regex = "1"
# Tool arguments and JSON Schemas are plain `serde_json::Value`s — that is the
# whole of `brain::Tool`'s wire format.
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding = "2"
walkdir = "2.5"
xiaoai = { path = "../rXiaoai", version = "0.2" }
# 0.3, never 0.4: the 0.4.0 release is a yanked failed refactor.
ncmc_lib = "0.3"
# `io` for `ReaderStream`, `io-util` for `SyncIoBridge` — together they let the
# synchronous `NcmFile` reader feed an async response body off the runtime.
tokio-util = { version = "0.7", features = ["io", "io-util"] }

[dev-dependencies]
# The three halves of the `.ncm` container format, needed only to build a
# synthetic fixture the real decoder accepts. Versions match ncmc_lib's own.
aes = "0.9"
base64 = "0.22"
ecb = { version = "0.2", features = ["alloc"] }
http-body-util = "0.1.4"
tempfile = "3.27.0"
# `test-util` for `#[tokio::test(start_paused = true)]`: the poll loop sleeps
# for seconds at a time, and a test of it must not.
tokio = { workspace = true, features = ["signal", "test-util"] }
tower = { version = "0.5", features = ["util"] }
