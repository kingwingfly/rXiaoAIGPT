[package]
name = "brain"
version = "0.1.0"
description = "Hardware-agnostic intent framework: traits an LLM agent drives a voice assistant through"
edition.workspace = true
license.workspace = true
repository.workspace = true

# brain must not depend on any hardware (`xiaoai`) or content (`netease`) crate —
# it defines the contract between an LLM and whatever is on the other end. Its
# heavyweights are `async-openai` (talking to the model is this crate's own job)
# and `rmcp`, whose MCP client is how it reaches tools.
[dependencies]
async-openai = { version = "0.41", default-features = false, features = [
    "chat-completion",
    "rustls",
] }
bon.workspace = true
dynosaur.workspace = true
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "transport-async-rw",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `axum` mocks the completions endpoint; the rmcp server + schemars stand up an
# in-memory MCP server to exercise the tool path. The real DeepSeek API is never
# called by tests.
[dev-dependencies]
axum = "0.8"
rmcp = { version = "2.2.0", default-features = false, features = [
    "server",
    "macros",
    "transport-async-rw",
] }
schemars = "1"
tokio = { workspace = true, features = ["net", "time", "io-util"] }
