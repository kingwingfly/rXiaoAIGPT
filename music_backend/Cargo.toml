[package]
name = "music_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.44.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
axum = { version = "0.8.1", features = ["macros"] }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.2", features = ["fs"] }
urlencoding = "2.1.3"
tokio-util = "0.7.14"
regex = { version = "1.11.1"}
walkdir = "2.5.0"
mime_guess = "2.0.5"
rand = "0.9.0"
