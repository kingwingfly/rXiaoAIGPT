[workspace]
members = ["rXiaoaiLLM", "rXiaoai"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kingwingfly/rXiaoAiLLM"

# Versions shared by both crates live here so they cannot drift apart.
[workspace.dependencies]
dotenvy = "0.15"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
