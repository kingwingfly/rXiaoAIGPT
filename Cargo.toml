[workspace]
members = ["rBrain", "rNetease", "rXiaoaiLLM", "rXiaoai"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kingwingfly/rXiaoAiLLM"

# Versions shared by both crates live here so they cannot drift apart.
[workspace.dependencies]
dotenvy = "0.15"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared by the new library crates (`netease`, `brain`).
async-trait = "0.1"
reqwest = { version = "0.13", features = ["cookies", "json"] }
