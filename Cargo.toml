[workspace]
members = ["rBrain", "rNetease", "rXiaoaiLLM", "rXiaoai"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kingwingfly/rXiaoAiLLM"

# Versions shared by both crates live here so they cannot drift apart.
[workspace.dependencies]
dotenvy = "0.15"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `brain` erases its device traits with dynosaur: native `async fn` under static
# dispatch, boxed only where it hands out a `dyn`-style wrapper (`DynSpeaker`,
# `DynMusicSource`). Replaces `async-trait` — no per-call boxing on the hot path.
dynosaur = "0.3"
# Compile-time-checked builders, so config structs need no hand-written setters.
bon = "3"
# `stream` is what makes `Response::bytes_stream()` available — remote audio is
# proxied through, never buffered.
reqwest = { version = "0.13", features = [
    "cookies",
    "json",
    "form",
    "query",
    "stream",
] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
