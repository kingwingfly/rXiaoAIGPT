[package]
name = "xiaoai"
version = "0.1.0-alpha.7"
edition = "2024"
license = "MIT"
description = "Utils to remote XiaoAi; 远程操作小爱同学（小爱音箱）"
repository = "https://github.com/kingwingfly/rXiaoAiLLM"
documentation = "https://docs.rs/xiaoai"
exclude = ["*.json"]

[dependencies]
api_req = { version = "0.3.0" }
rand = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
md5 = { version = "0.7.0" }
hex = "0.4.3"
sha1 = "0.10.6"
base64 = "0.22.1"
reqwest = { version = "0.12.15", features = ["cookies"] }
serde_json = { version = "1.0" }
dotenv = "0.15.0"
thiserror = "2.0.12"

[dev-dependencies]
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }
