[package]
name = "xiaoai"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Utils to remote XiaoAi; 远程操作小爱同学（小爱音箱）"
repository = "https://github.com/kingwingfly/rXiaoAiLLM"
documentation = "https://docs.rs/xiaoai"
exclude = ["*.json"]

[dependencies]
api_req = { version = "0.5" }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
md5 = { version = "0.8" }
hex = "0.4"
sha1 = "0.11"
base64 = "0.22"
reqwest = { version = "0.13", features = ["cookies"] }
serde_json = { version = "1.0" }
dotenvy = "0.15"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
